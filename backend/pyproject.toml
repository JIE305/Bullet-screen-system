[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "damusystem-backend"
version = "0.1.0"
description = "Local FastAPI bridge for the DaMuSystem desktop application"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.35,<1",
  "websockets>=13,<16",
  "rapidocr>=3.9,<4",
  "onnxruntime>=1.22,<2",
  "opencv-python>=4.10,<5",
  "numpy>=2,<3",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.16,<2",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pyinstaller>=6.14,<7",
]

[project.scripts]
damusystem-backend = "damusystem_backend.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
